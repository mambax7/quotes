quote_quotes:
    options: 'ENGINE=MyISAM DEFAULT CHARSET=utf8'
    columns:
        -
            name: id
            attributes: ' int(11)  NOT NULL auto_increment'
        -
            name: cid
            attributes: ' int(8)  NOT NULL  DEFAULT ''0'' '
        -
            name: quote
            attributes: ' text  NOT NULL '
        -
            name: author_id
            attributes: ' int(11)  NOT NULL '
        -
            name: online
            attributes: ' int(10)  NOT NULL  DEFAULT ''1'' '
        -
            name: created
            attributes: ' int(11) unsigned  NOT NULL  DEFAULT ''0'' '
        -
            name: updated
            attributes: ' int(11) unsigned  NOT NULL  DEFAULT ''0'' '
    keys:
        PRIMARY:
            columns: id
            unique: true
quote_category:
    options: 'ENGINE=MyISAM DEFAULT CHARSET=utf8'
    columns:
        -
            name: id
            attributes: ' int(8)  NOT NULL auto_increment'
        -
            name: pid
            attributes: ' int(8)  NOT NULL  DEFAULT ''0'' '
        -
            name: title
            attributes: ' varchar(255)  NOT NULL '
        -
            name: description
            attributes: ' text  DEFAULT ''NULL'' '
        -
            name: image
            attributes: ' varchar(255)  DEFAULT ''NULL'' '
        -
            name: weight
            attributes: ' int(5)  NOT NULL  DEFAULT ''0'' '
        -
            name: color
            attributes: ' varchar(10)  NOT NULL  DEFAULT ''''0'''' '
        -
            name: online
            attributes: ' tinyint(2)  NOT NULL  DEFAULT ''1'' '
    keys:
        PRIMARY:
            columns: id
            unique: true
quote_authors:
    options: 'ENGINE=MyISAM DEFAULT CHARSET=utf8'
    columns:
        -
            name: id
            attributes: ' int(8)  NOT NULL auto_increment'
        -
            name: name
            attributes: ' varchar(50)  NOT NULL '
        -
            name: country
            attributes: ' varchar(3)  NOT NULL '
        -
            name: bio
            attributes: ' text  NOT NULL '
        -
            name: photo
            attributes: ' varchar(50)  NOT NULL '
        -
            name: created
            attributes: ' int(11) unsigned  NOT NULL  DEFAULT ''0'' '
        -
            name: updated
            attributes: ' int(11) unsigned  NOT NULL  DEFAULT ''0'' '
    keys:
        PRIMARY:
            columns: id
            unique: true
